<!doctype html>
<html lang="en" class="h-full w-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Leaderboard Dashboard</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
    }

    .soft-grid {
      background-image:
        radial-gradient(circle at 18% 12%, rgba(168, 85, 247, 0.18), transparent 28%),
        radial-gradient(circle at 82% 8%, rgba(108, 77, 255, 0.16), transparent 30%),
        linear-gradient(135deg, rgba(255,255,255,0.96), rgba(248,245,255,0.98));
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(139, 92, 246, 0.14);
      box-shadow: 0 20px 55px rgba(88, 28, 135, 0.10);
    }

    .purple-glow {
      box-shadow: 0 24px 70px rgba(108, 77, 255, 0.28);
    }

    .podium-card {
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .podium-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 26px 65px rgba(108, 77, 255, 0.20);
    }

    .table-row {
      transition: transform 180ms ease, background 180ms ease;
    }

    .table-row:hover {
      transform: translateX(4px);
      background: rgba(245, 243, 255, 0.92);
    }

    .nav-item {
      transition: all 180ms ease;
    }

    .nav-item:hover {
      background: rgba(139, 92, 246, 0.12);
      transform: translateX(3px);
    }

    .active-nav {
      background: linear-gradient(135deg, #6C4DFF, #A855F7);
      color: white;
      box-shadow: 0 16px 32px rgba(108, 77, 255, 0.28);
    }

    .bar-fill {
      animation: growBar 900ms ease both;
      transform-origin: left;
    }

    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .rise-in {
      animation: riseIn 650ms ease both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chart-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: drawLine 1400ms ease forwards;
    }

    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }

    .focus-ring:focus {
      outline: 3px solid rgba(168, 85, 247, 0.35);
      outline-offset: 3px;
    }

    .scroll-clean::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .scroll-clean::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.32);
      border-radius: 999px;
    }
  </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full w-full overflow-hidden">
  <div id="app" class="h-full w-full overflow-auto soft-grid text-slate-900">
   <div class="flex min-h-full w-full">
    <main class="flex-1 px-4 py-5 sm:px-6 lg:px-8">
     <header class="rise-in mb-6 flex flex-col gap-4 rounded-[2rem] border border-white/70 bg-white/72 p-5 shadow-xl shadow-purple-100/70 backdrop-blur-xl md:flex-row md:items-center md:justify-between">
      <div>
       <div class="mb-2 inline-flex items-center gap-2 rounded-full bg-purple-50 px-3 py-1 text-xs font-bold text-[#6C4DFF]">
        <span class="h-2 w-2 rounded-full bg-[#A855F7]"></span> Live academic ranking
       </div>
       <h1 id="dashboardTitle" class="text-3xl font-extrabold tracking-tight text-slate-950 sm:text-4xl">Student Leaderboard</h1>
       <p id="dashboardSubtitle" class="mt-2 max-w-2xl text-sm font-medium leading-6 text-slate-500">Track top scorers, academic momentum, and class performance.</p>
      </div>
      <div class="flex flex-col gap-3 sm:flex-row">
       <div class="relative">
        <label for="studentSearch" class="sr-only">Search students</label> <i data-lucide="search" class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i> <input id="studentSearch" type="search" placeholder="Search students..." class="focus-ring w-full rounded-2xl border border-purple-100 bg-white py-3 pl-11 pr-4 text-sm font-medium text-slate-700 shadow-sm outline-none sm:w-64">
       </div><label for="classFilter" class="sr-only">Filter by class</label> <select id="classFilter" class="focus-ring rounded-2xl border border-purple-100 bg-white px-4 py-3 text-sm font-bold text-slate-700 shadow-sm outline-none"> <option value="all">All Classes</option> <option value="10A">Class 10A</option> <option value="10B">Class 10B</option> <option value="9A">Class 9A</option> </select>
      </div>
     </header>
     <div class="grid gap-6">
      <section aria-labelledby="leaderboardHeading" class="glass-card rise-in rounded-[2rem] p-5">
       <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
         <h2 id="leaderboardHeading" class="text-xl font-extrabold">Leaderboard Table</h2>
         <p class="text-sm font-medium text-slate-500">Rank positions, marks, attendance and trend.</p>
        </div>
       </div>
       <div class="overflow-x-auto scroll-clean">
        <table class="w-full min-w-[720px] border-separate border-spacing-y-3">
         <thead>
          <tr class="text-left text-xs font-extrabold uppercase tracking-wide text-slate-400">
           <th class="px-4">Rank</th>
           <th class="px-4">Student</th>
           <th class="px-4">Class</th>
           <th class="px-4">Total Marks</th>
           <th class="px-4">Attendance</th>
           <th class="px-4">Trend</th>
          </tr>
         </thead>
         <tbody id="leaderboardBody"></tbody>
        </table>
       </div>
      </section>
     </div>
    </main>
   </div>
   <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-2xl bg-slate-950 px-5 py-3 text-sm font-bold text-white opacity-0 shadow-2xl transition duration-300">
    Winners celebrated! Keep the momentum going.
   </div>
  </div>
  <script>
    const defaultConfig = {
      dashboard_title: "Student Leaderboard",
      dashboard_subtitle: "Track top scorers and academic performance.",
      search_placeholder: "Search students..."
    };

    const students = [
      { rank: 1, name: "Maya Kapoor", className: "10B", marks: 494, attendance: 98, trend: "up", score: "98.8%", avatar: "👩‍🎓" },
      { rank: 2, name: "Aarav Mehta", className: "10A", marks: 481, attendance: 96, trend: "up", score: "96.2%", avatar: "🧑‍🎓" },
      { rank: 3, name: "Zoya Rahman", className: "9A", marks: 474, attendance: 94, trend: "up", score: "94.7%", avatar: "👨‍🎓" },
      { rank: 4, name: "Liam Chen", className: "10A", marks: 463, attendance: 91, trend: "up", score: "92.6%", avatar: "👦" },
      { rank: 5, name: "Sara Williams", className: "10B", marks: 452, attendance: 89, trend: "down", score: "90.4%", avatar: "👧" },
      { rank: 6, name: "Noah Singh", className: "9A", marks: 441, attendance: 93, trend: "up", score: "88.2%", avatar: "🧒" },
      { rank: 7, name: "Emma Davis", className: "10A", marks: 430, attendance: 87, trend: "down", score: "86.0%", avatar: "👩" }
    ];

    const leaderboardBody = document.getElementById("leaderboardBody");
    const searchInput = document.getElementById("studentSearch");
    const classFilter = document.getElementById("classFilter");
    const toast = document.getElementById("toast");

    function trendMarkup(trend) {
      const isUp = trend === "up";
      return `
        <span class="inline-flex items-center gap-1 rounded-full ${isUp ? "bg-emerald-50 text-emerald-600" : "bg-rose-50 text-rose-600"} px-3 py-1 text-xs font-extrabold">
          <i data-lucide="${isUp ? "arrow-up-right" : "arrow-down-right"}" class="h-4 w-4"></i>
          ${isUp ? "Improving" : "Needs focus"}
        </span>
      `;
    }

    function renderRows() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedClass = classFilter.value;

      const filtered = students.filter(student => {
        const matchesSearch = student.name.toLowerCase().includes(query);
        const matchesClass = selectedClass === "all" || student.className === selectedClass;
        return matchesSearch && matchesClass;
      });

      leaderboardBody.innerHTML = filtered.map(student => `
        <tr class="table-row rounded-3xl bg-white shadow-sm">
          <td class="rounded-l-3xl px-4 py-4">
            <span class="flex h-10 w-10 items-center justify-center rounded-2xl ${student.rank <= 3 ? "bg-purple-100 text-[#6C4DFF]" : "bg-slate-100 text-slate-500"} text-sm font-extrabold">#${student.rank}</span>
          </td>
          <td class="px-4 py-4">
            <div class="flex items-center gap-3">
              <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-purple-50 text-xl">${student.avatar}</span>
              <div>
                <p class="font-extrabold text-slate-900">${student.name}</p>
                <p class="text-xs font-semibold text-slate-400">${student.score} overall</p>
              </div>
            </div>
          </td>
          <td class="px-4 py-4 text-sm font-bold text-slate-600">${student.className}</td>
          <td class="px-4 py-4 text-sm font-extrabold text-slate-900">${student.marks}/500</td>
          <td class="px-4 py-4">
            <div class="flex items-center gap-3">
              <div class="h-2 w-20 rounded-full bg-purple-100">
                <div class="h-2 rounded-full bg-gradient-to-r from-[#6C4DFF] to-[#A855F7]" style="width: ${student.attendance}%"></div>
              </div>
              <span class="text-sm font-bold text-slate-600">${student.attendance}%</span>
            </div>
          </td>
          <td class="rounded-r-3xl px-4 py-4">${trendMarkup(student.trend)}</td>
        </tr>
      `).join("");

      if (filtered.length === 0) {
        leaderboardBody.innerHTML = `
          <tr>
            <td colspan="6" class="rounded-3xl bg-white px-4 py-10 text-center text-sm font-bold text-slate-500">
              No students found. Try a different search or class filter.
            </td>
          </tr>
        `;
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    searchInput.addEventListener("input", renderRows);
    classFilter.addEventListener("change", renderRows);

    document.querySelectorAll(".tab-button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab-button").forEach(tab => {
          tab.classList.remove("bg-white", "text-[#6C4DFF]", "shadow-sm");
          tab.classList.add("text-slate-500");
        });
        button.classList.add("bg-white", "text-[#6C4DFF]", "shadow-sm");
        button.classList.remove("text-slate-500");
      });
    });

    document.getElementById("celebrateButton").addEventListener("click", () => {
      toast.classList.remove("opacity-0");
      toast.classList.add("opacity-100");
      setTimeout(() => {
        toast.classList.remove("opacity-100");
        toast.classList.add("opacity-0");
      }, 2200);
    });

    function applyConfig(config) {
      const cfg = Object.assign({}, defaultConfig, config || {});

      document.getElementById("dashboardTitle").textContent = cfg.dashboard_title;
      document.getElementById("dashboardSubtitle").textContent = cfg.dashboard_subtitle;
      document.getElementById("studentSearch").placeholder = cfg.search_placeholder;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: async (config) => {
          applyConfig(config);
        },
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["dashboard_title", config.dashboard_title || defaultConfig.dashboard_title],
          ["dashboard_subtitle", config.dashboard_subtitle || defaultConfig.dashboard_subtitle]
        ])
      });
    } else {
      applyConfig(defaultConfig);
    }

    renderRows();

    if (window.lucide) {
      lucide.createIcons();
    }
  </script>

</html>
